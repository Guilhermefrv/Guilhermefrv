<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Linha cyberpunk animada">
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#7117ea"/><stop offset=".5" stop-color="#f000ff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="24" fill="#0d0618" rx="6"/>
  <g filter="url(#glow)">
    <rect x="-300" y="9" width="340" height="6" rx="3" fill="url(#line)">
      <animate attributeName="x" from="-340" to="1200" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="-700" y="10" width="160" height="4" rx="2" fill="#e100ff">
      <animate attributeName="x" from="-200" to="1200" dur="2.1s" begin=".7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
