<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-label="Olá! Me chamo Guilherme Romão, fique à vontade para me conhecer mais!">
  <defs>
    <linearGradient id="title" x1="0" x2="1"><stop stop-color="#8a2be2"/><stop offset=".55" stop-color="#f000ff"/><stop offset="1" stop-color="#00d9ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="url(#title)" filter="url(#glow)">Olá! Me chamo Guilherme Romão, fique à vontade para me conhecer mais!</text>
</svg>
